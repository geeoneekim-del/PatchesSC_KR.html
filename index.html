<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PatchesSC Versus Mod — 카탈로그</title>
<style>
:root{--void:#070c15;--panel:#13202f;--line:#2b4260;--ink:#f0f5fc;--dim:#a9bcd2;--cyan:#5adcec}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void);
 font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{padding:16px 20px 0;border-bottom:1px solid var(--line)}
h1{margin:0 0 14px;font-size:1.3em;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.tabs{display:flex;gap:8px}
.tab{appearance:none;cursor:pointer;font:inherit;font-size:.92em;font-weight:700;
 color:var(--dim);background:transparent;border:1px solid transparent;
 border-bottom:none;padding:10px 18px;border-radius:6px 6px 0 0;transition:.14s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--void);background:var(--cyan)}
.frame-wrap{flex:1;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--void)}
</style></head>
<body>
<header>
  <h1>PatchesSC Versus Mod 카탈로그</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-src="PatchesSC_Changes_Catalog.html">변경사항</button>
    <button class="tab" role="tab" aria-selected="false" data-src="PatchesSC_Icon_Catalog.html">신규 내용</button>
  </div>
</header>
<div class="frame-wrap">
  <iframe id="view" src="PatchesSC_Changes_Catalog.html" title="카탈로그"></iframe>
</div>
<script>
var tabs = [].slice.call(document.querySelectorAll('.tab'));
var frame = document.getElementById('view');
tabs.forEach(function(t){
  t.addEventListener('click', function(){
    if (t.getAttribute('aria-selected') === 'true') return;
    tabs.forEach(function(x){ x.setAttribute('aria-selected', x===t ? 'true' : 'false'); });
    frame.src = t.dataset.src;
  });
});
</script>
</body></html>
